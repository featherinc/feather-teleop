[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "feather-teleop"
version = "0.1.0"
description = "Meta Quest teleoperation of Feather robots, built on FeatherSDK"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
# FeatherSDK is not listed: the robot's computer has it, and the laptop that streams the headset does not need it.
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
robot = ["pin", "av", "aiohttp"]   # Pinocchio for the solver, PyAV for the recordings, aiohttp for the worn headset

[tool.setuptools.packages.find]
include = ["feather_teleop*"]

[tool.setuptools.package-data]
"feather_teleop.headsets" = ["web/*"]

[tool.ruff]
line-length = 120
extend-exclude = ["feathersdk_new", "meta_quest_teleop"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "E741", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["feather_teleop"]
